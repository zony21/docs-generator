name: Apply authoritative template update

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - .github/workflows/apply-authoritative-template-update.yml
      - .authoritative-update.part*

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply prepared source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .authoritative-update.part* | base64 --decode | tar -xz
          rm -f .authoritative-update.part*
          rm -f .github/workflows/apply-authoritative-template-update.yml

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: align generator with authoritative templates"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
